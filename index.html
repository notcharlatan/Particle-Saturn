<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>个人主页 - 粒子土星背景</title>

    <!-- 本地路径引入（适配WSL目录） -->
    <script src="libs/three.min.js"></script>
    <script src="libs/controls/TrackballControls.js"></script>
    <script src="node_modules/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="node_modules/@mediapipe/control_utils/control_utils.js"></script>
    <script src="node_modules/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="node_modules/@mediapipe/hands/hands.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
            color: white;
            cursor: grab;
            touch-action: none;
        }

        body:active {
            cursor: grabbing;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            background: radial-gradient(circle at center, #050505 0%, #0b0b10 100%);
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #main-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            pointer-events: none;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 【修改1】默认隐藏土星介绍框 */
        .glass-panel {
            display: none;
            background: rgba(5, 5, 5, 0.7);
            backdrop-filter: blur(12px);
            padding: 16px 20px;
            border-radius: 8px;
            border-left: 2px solid #c5a059;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
            max-width: 280px;
            width: calc(100% - 40px);
            margin: 0 auto 20px;
        }

        h1 {
            font-weight: 200;
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            margin: 0 0 10px 0;
            color: #e0cda7;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .status-text {
            font-size: clamp(0.7rem, 2vw, 0.85rem);
            color: #888;
            line-height: 1.6;
            font-family: monospace;
        }

        .highlight {
            color: #c5a059;
            font-weight: bold;
        }

        .btn {
            background: transparent;
            border: 1px solid rgba(197, 160, 89, 0.3);
            color: #c5a059;
            padding: 10px 24px;
            font-size: clamp(0.7rem, 2vw, 0.8rem);
            cursor: pointer;
            transition: all 0.4s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 4px;
            pointer-events: auto;
            min-height: 44px;
            min-width: 120px;
        }

        .btn:hover {
            background: rgba(197, 160, 89, 0.1);
            border-color: #c5a059;
            box-shadow: 0 0 15px rgba(197, 160, 89, 0.2);
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            pointer-events: auto;
            margin-bottom: 80px;
        }

        /* 【修改2】默认隐藏操作提示 */
        #control-tips {
            display: none;
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 10;
            font-size: clamp(0.6rem, 1.8vw, 0.7rem);
            color: #888;
            font-family: monospace;
            pointer-events: none;
            line-height: 1.5;
            max-width: 80%;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            text-align: center;
            color: #444;
            font-size: clamp(0.7rem, 2vw, 0.8rem);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        #fps-counter {
            position: absolute;
            top: 10px;
            right: 10px;
            color: #333;
            font-family: monospace;
            font-size: 10px;
            z-index: 5;
        }

        .input_video { display: none; }

        /* 新增：社交图标样式 */
        .social-icons {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 15;
            display: flex;
            flex-direction: row;
            gap: 16px;
            pointer-events: auto;
            align-items: center;
        }

        .social-icon {
            width: clamp(40px, 6vw, 60px);
            height: clamp(40px, 6vw, 60px);
            border-radius: 50%;
            background: rgba(5, 5, 5, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(197, 160, 89, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .social-icon:hover {
            transform: scale(1.1);
            border-color: #c5a059;
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.3);
        }

        .social-icon img {
            width: 60%;
            height: 60%;
            object-fit: contain;
            filter: invert(80%) sepia(20%) saturate(100%) hue-rotate(30deg) brightness(90%);
        }

        .avatar-icon {
            position: relative;
        }

        .avatar-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: none;
        }

        .avatar-tooltip {
            position: absolute;
            bottom: 120%;
            right: 0;
            background: rgba(5, 5, 5, 0.9);
            backdrop-filter: blur(8px);
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #c5a059;
            font-size: clamp(0.6rem, 1.5vw, 0.75rem);
            color: #e0cda7;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            white-space: nowrap;
            pointer-events: none;
        }

        .avatar-icon:hover .avatar-tooltip {
            opacity: 1;
            visibility: visible;
        }

        /* 响应式适配 */
        @media (max-width: 768px) {
            .glass-panel {
                padding: 12px 16px;
            }
            .btn {
                padding: 8px 16px;
                min-height: 40px;
                min-width: 100px;
            }
            /* 【修改3】手机端操作提示移到页面最底部 */
            #control-tips {
                bottom: 0;
                left: 0;
                right: 0;
                max-width: 100%;
                padding: 10px;
                text-align: center;
                background: rgba(0,0,0,0.5);
            }
            .social-icons {
                bottom: 80px;
                right: 50%;
                transform: translateX(50%);
                gap: 12px;
            }
            .social-icon {
                width: clamp(35px, 8vw, 50px);
                height: clamp(35px, 8vw, 50px);
            }
            .btn-group {
                margin-bottom: 120px;
            }
            .avatar-tooltip {
                bottom: auto;
                top: 120%;
                right: 50%;
                transform: translateX(50%);
            }
        }

        /* 背景隐藏状态（保留原样式，不影响核心功能） */
        .bg-hidden {
            opacity: 0;
            visibility: hidden;
        }
    </style>
</head>

    <!-- 着色器代码（保持不变） -->
    <script type="x-shader/x-vertex" id="vertexshader">
        attribute float size;
        attribute vec3 customColor;
        attribute float opacityAttr;
        attribute float orbitSpeed;
        attribute float isRing;
        attribute float aRandomId;

        varying vec3 vColor;
        varying float vDist;
        varying float vOpacity;
        varying float vScaleFactor;
        varying float vIsRing;

        uniform float uTime;
        uniform float uScale;

        mat2 rotate2d(float _angle){
            return mat2(cos(_angle),-sin(_angle),
                        sin(_angle),cos(_angle));
        }

        float hash(float n) { return fract(sin(n) * 43758.5453123); }

        void main() {
            float normScaleLOD = clamp((uScale - 0.15) / 2.35, 0.0, 1.0);
            float visibilityThreshold = 0.9 + pow(normScaleLOD, 1.2) * 0.1;

            if (aRandomId > visibilityThreshold) {
                gl_Position = vec4(0.0);
                gl_PointSize = 0.0;
                return;
            }

            vec3 pos = position;

            // 土星自身旋转（核心：粒子自转，摄像头不动）
            if (isRing > 0.5) {
                float angleOffset = uTime * orbitSpeed * 0.2;
                vec2 rotatedXZ = rotate2d(angleOffset) * pos.xz;
                pos.x = rotatedXZ.x;
                pos.z = rotatedXZ.y;
            } else {
                float bodyAngle = uTime * 0.03; // 土星本体自转速度
                vec2 rotatedXZ = rotate2d(bodyAngle) * pos.xz;
                pos.x = rotatedXZ.x;
                pos.z = rotatedXZ.y;
            }

            vec4 mvPosition = modelViewMatrix * vec4(pos * uScale, 1.0);
            float dist = -mvPosition.z;
            vDist = dist;

            float chaosThreshold = 25.0;
            if (dist < chaosThreshold && dist > 0.1) {
                float chaosIntensity = 1.0 - (dist / chaosThreshold);
                chaosIntensity = pow(chaosIntensity, 3.0);

                float highFreqTime = uTime * 40.0;
                float noiseX = sin(highFreqTime + pos.x * 10.0) * hash(pos.y);
                float noiseY = cos(highFreqTime + pos.y * 10.0) * hash(pos.x);
                float noiseZ = sin(highFreqTime * 0.5) * hash(pos.z);

                vec3 noiseVec = vec3(noiseX, noiseY, noiseZ) * chaosIntensity * 3.0;
                mvPosition.xyz += noiseVec;
            }

            gl_Position = projectionMatrix * mvPosition;

            float pointSize = size * (350.0 / dist);
            pointSize *= 0.55;

            if (isRing < 0.5 && dist < 50.0) {
                 pointSize *= 0.8;
            }

            gl_PointSize = clamp(pointSize, 0.0, 300.0);

            vColor = customColor;
            vOpacity = opacityAttr;
            vScaleFactor = uScale;
            vIsRing = isRing;
        }
    </script>

    <script type="x-shader/x-fragment" id="fragmentshader">
        varying vec3 vColor;
        varying float vDist;
        varying float vOpacity;
        varying float vScaleFactor;
        varying float vIsRing;

        void main() {
            vec2 cxy = 2.0 * gl_PointCoord - 1.0;
            float r = dot(cxy, cxy);
            if (r > 1.0) discard;

            float glow = smoothstep(1.0, 0.4, r);

            float t = clamp((vScaleFactor - 0.15) / 2.35, 0.0, 1.0);

            vec3 deepGold = vec3(0.35, 0.22, 0.05);
            float colorMix = smoothstep(0.1, 0.9, t);
            vec3 baseColor = mix(deepGold, vColor, colorMix);

            float brightness = 0.2 + 1.0 * t;

            float densityAlpha = 0.25 + 0.45 * smoothstep(0.0, 0.5, t);

            vec3 finalColor = baseColor * brightness;

            if (vDist < 40.0) {
                float closeMix = 1.0 - (vDist / 40.0);

                if (vIsRing < 0.5) {
                    vec3 deepTexture = pow(vColor, vec3(1.4)) * 1.5;
                    finalColor = mix(finalColor, deepTexture, closeMix * 0.8);
                } else {
                    finalColor += vec3(0.15, 0.12, 0.1) * closeMix;
                }
            }

            float depthAlpha = 1.0;
            if (vDist < 10.0) depthAlpha = smoothstep(0.0, 10.0, vDist);

            float alpha = glow * vOpacity * densityAlpha * depthAlpha;

            gl_FragColor = vec4(finalColor, alpha);
        }
    </script>

    <script type="x-shader/x-vertex" id="starVertexShader">
        attribute float size;
        attribute vec3 customColor;
        varying vec3 vColor;
        uniform float uTime;

        void main() {
            vColor = customColor;
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            float dist = -mvPosition.z;
            gl_PointSize = size * (1000.0 / dist);
            gl_PointSize = clamp(gl_PointSize, 1.0, 8.0);
            gl_Position = projectionMatrix * mvPosition;
        }
    </script>

    <script type="x-shader/x-fragment" id="starFragmentShader">
        varying vec3 vColor;
        uniform float uTime;
        float random(vec2 st) { return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123); }
        void main() {
            vec2 cxy = 2.0 * gl_PointCoord - 1.0;
            float r = dot(cxy, cxy);
            if (r > 1.0) discard;

            float noise = random(gl_FragCoord.xy);
            float twinkle = 0.7 + 0.3 * sin(uTime * 2.0 + noise * 10.0);

            float glow = 1.0 - r;
            glow = pow(glow, 1.5);

            gl_FragColor = vec4(vColor * twinkle, glow * 0.8);
        }
    </script>

    <script type="x-shader/x-vertex" id="planetVertexShader">
        varying vec2 vUv;
        varying vec3 vNormal;
        varying vec3 vViewPosition;
        void main() {
            vUv = uv;
            vNormal = normalize(normalMatrix * normal);
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            vViewPosition = -mvPosition.xyz;
            gl_Position = projectionMatrix * mvPosition;
        }
    </script>

    <script type="x-shader/x-fragment" id="planetFragmentShader">
        uniform vec3 color1;
        uniform vec3 color2;
        uniform float noiseScale;
        uniform vec3 lightDir;
        uniform float atmosphere;

        varying vec2 vUv;
        varying vec3 vNormal;
        varying vec3 vViewPosition;

        float random(vec2 st) { return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123); }
        float noise(vec2 st) {
            vec2 i = floor(st);
            vec2 f = fract(st);
            float a = random(i);
            float b = random(i + vec2(1.0, 0.0));
            float c = random(i + vec2(0.0, 1.0));
            float d = random(i + vec2(1.0, 1.0));
            vec2 u = f * f * (3.0 - 2.0 * f);
            return mix(a, b, u.x) + (c - a)* u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
        }

        float fbm(vec2 st) {
            float value = 0.0;
            float amplitude = 0.5;
            for (int i = 0; i < 5; i++) {
                value += amplitude * noise(st);
                st *= 2.0;
                amplitude *= 0.5;
            }
            return value;
        }

        void main() {
            float n = fbm(vUv * noiseScale);
            vec3 albedo = mix(color1, color2, n);

            vec3 normal = normalize(vNormal);
            vec3 light = normalize(lightDir);
            float diff = max(dot(normal, light), 0.05);

            vec3 viewDir = normalize(vViewPosition);
            float fresnel = pow(1.0 - dot(viewDir, normal), 3.0);

            vec3 finalColor = albedo * diff + atmosphere * vec3(0.5, 0.6, 1.0) * fresnel;

            gl_FragColor = vec4(finalColor, 1.0);
        }
    </script>

    <script>
        let scene, camera, renderer, particles, stars, nebula, controls;
        let planetGroup;
        let uniforms, starUniforms;

        let targetScale = 1.0;
        let currentScale = 1.0;
        let isHandDetected = false;
        let autoIdleTime = 0;
        let touchStartDistance = 0;
        
        // 新增：背景信息显示状态（替代原背景显示状态）
        let isInfoVisible = false;
        
        // 新增：手势旋转的目标角度和当前角度（用于平滑过渡）
        let targetRotationX = 0; // 上下旋转角度
        let targetRotationY = 0; // 左右旋转角度
        let currentRotationX = 0;
        let currentRotationY = 0;
        const rotationSmoothFactor = 0.1; // 旋转平滑系数

        const videoElement = document.getElementsByClassName('input_video')[0];
        const statusElement = document.getElementById('status-indicator');
        const loadingElement = document.getElementById('loading');
        const canvasContainer = document.getElementById('canvas-container');
        const avatarIcon = document.querySelector('.avatar-icon');
        // 新增：获取土星介绍框和操作提示元素
        const glassPanel = document.querySelector('.glass-panel');
        const controlTips = document.getElementById('control-tips');

        // 初始化Three.js场景
        function initThree() {
            const container = document.getElementById('canvas-container');

            // 1. 场景初始化
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x020202, 0.00015);

            // 2. 相机初始化（TrackballControls控制此相机）
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 10000);
            camera.position.set(0, 20, 100); // 初始位置
            camera.lookAt(0, 0, 0); // 始终看向土星中心

            // 3. 初始化土星、星空、背景行星
            initSaturn();
            initStarfield();
            initPlanets();

            // 4. 渲染器初始化
            renderer = new THREE.WebGLRenderer({
                antialias: true,
                alpha: true,
                powerPreference: "high-performance"
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x000000, 0);
            container.appendChild(renderer.domElement);

            // 5. 初始化TrackballControls（核心：无限旋转摄像头）
            controls = new THREE.TrackballControls(camera, renderer.domElement);
            controls.rotateSpeed = 1.2; // 旋转速度
            controls.zoomSpeed = 1.5;   // 缩放速度
            controls.panSpeed = 0.8;    // 平移速度（禁用，只保留旋转/缩放）
            controls.noPan = true;      // 禁用平移，只允许旋转和缩放
            controls.noZoom = false;    // 允许缩放
            controls.staticMoving = false; // 惯性旋转
            controls.dynamicDampingFactor = 0.08; // 惯性阻尼
            // TrackballControls默认支持无限旋转，无需额外配置

            // 6. 窗口适配
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                controls.handleResize(); // TrackballControls适配窗口大小
            });

            // 7. 手机端触摸缩放（兼容TrackballControls）
            let touchStartX = 0, touchStartY = 0;
            document.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                } else if (e.touches.length === 2) {
                    const touch1 = e.touches[0];
                    const touch2 = e.touches[1];
                    touchStartDistance = Math.hypot(touch1.clientX - touch2.clientX, touch1.clientY - touch2.clientY);
                }
            });

            document.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (e.touches.length === 2) {
                    // 双指缩放
                    const touch1 = e.touches[0];
                    const touch2 = e.touches[1];
                    const dist = Math.hypot(touch1.clientX - touch2.clientX, touch1.clientY - touch2.clientY);
                    const scaleDelta = (dist - touchStartDistance) / 100;
                    targetScale = Math.max(0.15, Math.min(2.5, targetScale + scaleDelta));
                    touchStartDistance = dist;
                }
            }, { passive: false });

            // 启动动画循环
            animate();
        }

        // 初始化土星粒子（保留自身旋转）
        function initSaturn() {
            const particleCount = 1200000;
            const geometry = new THREE.BufferGeometry();

            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            const sizes = new Float32Array(particleCount);
            const opacities = new Float32Array(particleCount);
            const orbitSpeeds = new Float32Array(particleCount);
            const isRings = new Float32Array(particleCount);
            const randomIds = new Float32Array(particleCount);

            const bodyColors = [
                new THREE.Color('#E3DAC5'),
                new THREE.Color('#C9A070'),
                new THREE.Color('#E3DAC5'),
                new THREE.Color('#B08D55')
            ];

            const colorRingC = new THREE.Color('#2A2520');
            const colorRingB_Inner = new THREE.Color('#CDBFA0');
            const colorRingB_Outer = new THREE.Color('#DCCBBA');
            const colorCassini = new THREE.Color('#050505');
            const colorRingA = new THREE.Color('#989085');
            const colorRingF = new THREE.Color('#AFAFA0');

            const R_PLANET = 18;

            for(let i = 0; i < particleCount; i++) {
                let x, y, z, r, g, b, size, opacity, speed, isRingVal;
                randomIds[i] = Math.random();

                if (i < particleCount * 0.25) {
                    // 土星本体粒子
                    isRingVal = 0.0;
                    speed = 0.0;
                    const u = Math.random();
                    const v = Math.random();
                    const theta = 2 * Math.PI * u;
                    const phi = Math.acos(2 * v - 1);
                    const rad = R_PLANET;

                    x = rad * Math.sin(phi) * Math.cos(theta);
                    let rawY = rad * Math.cos(phi);
                    z = rad * Math.sin(phi) * Math.sin(theta);
                    y = rawY * 0.9;

                    let lat = (rawY / rad + 1.0) * 0.5;
                    let bandNoise = Math.cos(lat * 40.0) * 0.8 + Math.cos(lat * 15.0) * 0.4;
                    let colIndex = Math.floor(lat * 4 + bandNoise) % 4;
                    if (colIndex < 0) colIndex = 0;
                    let baseCol = bodyColors[colIndex];

                    r = baseCol.r; g = baseCol.g; b = baseCol.b;
                    size = 1.0 + Math.random() * 0.8;
                    opacity = 0.8;
                } else {
                    // 土星环粒子
                    isRingVal = 1.0;
                    let zoneRand = Math.random();
                    let ringRadius;
                    let ringCol;

                    if (zoneRand < 0.15) {
                        ringRadius = R_PLANET * (1.235 + Math.random() * (1.525 - 1.235));
                        ringCol = colorRingC;
                        size = 0.5; opacity = 0.3;
                    } else if (zoneRand < 0.65) {
                        let t = Math.random();
                        ringRadius = R_PLANET * (1.525 + t * (1.95 - 1.525));
                        ringCol = colorRingB_Inner.clone().lerp(colorRingB_Outer, t);
                        size = 0.8 + Math.random() * 0.6; opacity = 0.85;
                        if (Math.sin(ringRadius * 2.0) > 0.8) opacity *= 1.2;
                    } else if (zoneRand < 0.69) {
                        ringRadius = R_PLANET * (1.95 + Math.random() * (2.025 - 1.95));
                        ringCol = colorCassini;
                        size = 0.3; opacity = 0.1;
                    } else if (zoneRand < 0.99) {
                        ringRadius = R_PLANET * (2.025 + Math.random() * (2.27 - 2.025));
                        ringCol = colorRingA;
                        size = 0.7; opacity = 0.6;
                        if (ringRadius > R_PLANET * 2.2 && ringRadius < R_PLANET * 2.21) opacity = 0.1;
                    } else {
                        ringRadius = R_PLANET * (2.32 + Math.random() * 0.02);
                        ringCol = colorRingF;
                        size = 1.0; opacity = 0.7;
                    }

                    const theta = Math.random() * Math.PI * 2;
                    x = ringRadius * Math.cos(theta);
                    z = ringRadius * Math.sin(theta);

                    let thickness = 0.15;
                    if (ringRadius > R_PLANET * 2.3) thickness = 0.4;
                    y = (Math.random() - 0.5) * thickness;

                    r = ringCol.r; g = ringCol.g; b = ringCol.b;
                    speed = 8.0 / Math.sqrt(ringRadius);
                }

                positions[i*3] = x; positions[i*3+1] = y; positions[i*3+2] = z;
                colors[i*3] = r; colors[i*3+1] = g; colors[i*3+2] = b;
                sizes[i] = size; opacities[i] = opacity;
                orbitSpeeds[i] = speed; isRings[i] = isRingVal;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('customColor', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            geometry.setAttribute('opacityAttr', new THREE.BufferAttribute(opacities, 1));
            geometry.setAttribute('orbitSpeed', new THREE.BufferAttribute(orbitSpeeds, 1));
            geometry.setAttribute('isRing', new THREE.BufferAttribute(isRings, 1));
            geometry.setAttribute('aRandomId', new THREE.BufferAttribute(randomIds, 1));

            uniforms = {
                uTime: { value: 0 },
                uScale: { value: 1.0 }
            };

            const material = new THREE.ShaderMaterial({
                depthWrite: false,
                blending: THREE.AdditiveBlending,
                vertexColors: true,
                uniforms: uniforms,
                vertexShader: document.getElementById('vertexshader').textContent,
                fragmentShader: document.getElementById('fragmentshader').textContent,
                transparent: true
            });

            particles = new THREE.Points(geometry, material);
            particles.rotation.z = 26.73 * (Math.PI / 180); // 土星轴倾角
            scene.add(particles);
        }

        // 初始化星空背景
        function initStarfield() {
            const starCount = 50000;
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(starCount * 3);
            const cols = new Float32Array(starCount * 3);
            const sizes = new Float32Array(starCount);

            const starColors = [
                new THREE.Color('#9bb0ff'), new THREE.Color('#ffffff'),
                new THREE.Color('#ffcc6f'), new THREE.Color('#ff7b7b')
            ];

            for(let i=0; i<starCount; i++) {
                const r = 400 + Math.random() * 3000;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);

                pos[i*3] = r * Math.sin(phi) * Math.cos(theta);
                pos[i*3+1] = r * Math.cos(phi);
                pos[i*3+2] = r * Math.sin(phi) * Math.sin(theta);

                const colorType = Math.random();
                let c;
                if(colorType > 0.9) c = starColors[0]; 
                else if(colorType > 0.6) c = starColors[1];
                else if(colorType > 0.3) c = starColors[2]; 
                else c = starColors[3];

                cols[i*3] = c.r; cols[i*3+1] = c.g; cols[i*3+2] = c.b;
                sizes[i] = 1.0 + Math.random() * 3.0;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('customColor', new THREE.BufferAttribute(cols, 3));
            geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            starUniforms = { uTime: { value: 0 } };
            const mat = new THREE.ShaderMaterial({
                uniforms: starUniforms,
                vertexShader: document.getElementById('starVertexShader').textContent,
                fragmentShader: document.getElementById('starFragmentShader').textContent,
                transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
            });
            stars = new THREE.Points(geo, mat);
            scene.add(stars);

            const nebulaCount = 100;
            const nebGeo = new THREE.BufferGeometry();
            const nebPos = new Float32Array(nebulaCount * 3);
            const nebCols = new Float32Array(nebulaCount * 3);
            const nebSizes = new Float32Array(nebulaCount);
            for(let i=0; i<nebulaCount; i++) {
                const r = 800 + Math.random() * 2000;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.PI / 2 + (Math.random() - 0.5) * 1.5;
                nebPos[i*3] = r * Math.sin(phi) * Math.cos(theta);
                nebPos[i*3+1] = r * Math.cos(phi);
                nebPos[i*3+2] = r * Math.sin(phi) * Math.sin(theta);
                const nc = new THREE.Color().setHSL(0.6 + Math.random()*0.2, 0.8, 0.05);
                nebCols[i*3] = nc.r; nebCols[i*3+1] = nc.g; nebCols[i*3+2] = nc.b;
                nebSizes[i] = 400.0 + Math.random() * 600.0;
            }
            nebGeo.setAttribute('position', new THREE.BufferAttribute(nebPos, 3));
            nebGeo.setAttribute('customColor', new THREE.BufferAttribute(nebCols, 3));
            nebGeo.setAttribute('size', new THREE.BufferAttribute(nebSizes, 1));
            const nebShaderMat = new THREE.ShaderMaterial({
                uniforms: {},
                vertexShader: document.getElementById('starVertexShader').textContent,
                fragmentShader: `
                    varying vec3 vColor;
                    void main() {
                        vec2 cxy = 2.0 * gl_PointCoord - 1.0;
                        float r = dot(cxy, cxy);
                        if(r > 1.0) discard;
                        float glow = pow(1.0 - r, 2.0);
                        gl_FragColor = vec4(vColor, glow * 0.1);
                    }
                `,
                transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
            });
            nebula = new THREE.Points(nebGeo, nebShaderMat);
            scene.add(nebula);
        }

        // 初始化背景行星
        function initPlanets() {
            planetGroup = new THREE.Group();
            scene.add(planetGroup);

            const vShader = document.getElementById('planetVertexShader').textContent;
            const fShader = document.getElementById('planetFragmentShader').textContent;

            createPlanet(planetGroup, vShader, fShader,
                new THREE.Color('#b33a00'), new THREE.Color('#d16830'), 8.0,
                { x: -300, y: 120, z: -450 }, 10, 0.3
            );

            createPlanet(planetGroup, vShader, fShader,
                new THREE.Color('#001e4d'), new THREE.Color('#ffffff'), 5.0,
                { x: 380, y: -100, z: -600 }, 14, 0.6
            );

            createPlanet(planetGroup, vShader, fShader,
                new THREE.Color('#666666'), new THREE.Color('#aaaaaa'), 15.0,
                { x: -180, y: -220, z: -350 }, 6, 0.1
            );
        }

        function createPlanet(group, vShader, fShader, c1, c2, nScale, pos, radius, atmo) {
            const geo = new THREE.SphereGeometry(radius, 48, 48);
            const mat = new THREE.ShaderMaterial({
                uniforms: {
                    color1: { value: c1 },
                    color2: { value: c2 },
                    noiseScale: { value: nScale },
                    lightDir: { value: new THREE.Vector3(1, 0.5, 1) },
                    atmosphere: { value: atmo }
                },
                vertexShader: vShader,
                fragmentShader: fShader
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(pos.x, pos.y, pos.z);
            group.add(mesh);
        }

        // 动画循环
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();
            uniforms.uTime.value = elapsedTime;
            if(starUniforms) starUniforms.uTime.value = elapsedTime;

            // 1. 更新TrackballControls（核心：摄像头旋转）
            controls.update();

            // 2. 土星自身旋转（粒子动画）
            if(stars) stars.rotation.y = elapsedTime * 0.005;
            if(nebula) nebula.rotation.y = elapsedTime * 0.003;

            // 3. 背景行星旋转
            if(planetGroup) {
                planetGroup.children.forEach((planet, idx) => {
                    planet.rotation.y = elapsedTime * (0.05 + idx * 0.02);
                });
                planetGroup.rotation.y = Math.sin(elapsedTime * 0.05) * 0.02;
            }

            // 4. 处理手势旋转的平滑过渡
            if (isHandDetected) {
                // 平滑插值旋转角度
                currentRotationX += (targetRotationX - currentRotationX) * rotationSmoothFactor;
                currentRotationY += (targetRotationY - currentRotationY) * rotationSmoothFactor;
                
                // 根据旋转角度计算摄像头位置
                const radius = 100; // 摄像头到土星中心的距离
                camera.position.x = radius * Math.sin(currentRotationY) * Math.cos(currentRotationX);
                camera.position.y = radius * Math.sin(currentRotationX);
                camera.position.z = radius * Math.cos(currentRotationY) * Math.cos(currentRotationX);
                camera.lookAt(0, 0, 0);
            }

            // 5. 自动巡航/手势/鼠标状态判断
            const isControlsActive = controls._state !== -1 || targetScale !== 1.0;
            if (!isHandDetected && !isControlsActive) {
                // 自动巡航
                autoIdleTime += 0.005;
                targetScale = 1.0 + Math.sin(autoIdleTime) * 0.2;
                
                // 自动缓慢旋转摄像头
                camera.position.x = 100 * Math.sin(autoIdleTime * 0.2);
                camera.position.z = 100 * Math.cos(autoIdleTime * 0.2);
                camera.lookAt(0, 0, 0);

                statusElement.innerHTML = "自动巡航";
                statusElement.style.color = "#666";
            } else if (isHandDetected) {
                statusElement.innerHTML = "手势控制";
                statusElement.style.color = "#c5a059";
            } else if (isControlsActive) {
                statusElement.innerHTML = "鼠标控制";
                statusElement.style.color = "#87ceeb";
            }

            // 6. 缩放插值（兼容手势/滚轮/自动巡航）
            const lerpFactor = 0.08;
            currentScale += (targetScale - currentScale) * lerpFactor;
            uniforms.uScale.value = currentScale;

            // 7. 渲染场景（始终渲染，不再控制背景显示）
            renderer.render(scene, camera);
        }

        // 初始化手势识别
        const hands = new Hands({
            locateFile: (file) => `node_modules/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        hands.onResults(onResults);

        // 手势控制逻辑
        function onResults(results) {
            loadingElement.style.display = 'none';

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                isHandDetected = true;
                const hand = results.multiHandLandmarks[0];

                // 1. 手势缩放（保留原有逻辑）
                const p1 = hand[4]; // 拇指指尖
                const p2 = hand[8]; // 食指指尖
                const dist = Math.sqrt((p1.x-p2.x)**2 + (p1.y-p2.y)**2);
                const normDist = Math.max(0, Math.min(1, (dist - 0.02) / 0.25));
                targetScale = 0.15 + normDist * 2.35;

                // 2. 手势旋转（核心修改部分）
                // 使用手掌中心（第9个关键点）作为旋转控制参考点
                const palmCenter = hand[9];
                
                // 映射手掌X坐标到左右旋转角度（-π 到 π）
                // 0.1~0.9 是手势识别的有效范围，避免边缘无效区域
                const normX = Math.max(0.1, Math.min(0.9, palmCenter.x));
                targetRotationY = (normX - 0.5) * Math.PI * 2; // 左右旋转 ±π
                
                // 映射手掌Y坐标到上下旋转角度（-π/4 到 π/4）
                // 限制上下旋转范围，避免摄像头翻转
                const normY = Math.max(0.1, Math.min(0.9, palmCenter.y));
                targetRotationX = (0.5 - normY) * Math.PI / 2; // 上下旋转 ±π/4

            } else {
                isHandDetected = false;
            }
        }

        // 启动摄像头
        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 640,
            height: 480
        });

        cameraUtils.start().catch(e => {
            console.error(e);
            loadingElement.innerText = "摄像头启动失败（请允许权限）";
        });

        // 自定义功能函数
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    showToast('全屏请求失败: ' + err.message);
                });
            } else if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }

        function resetView() {
            // 重置摄像头位置和缩放
            targetScale = 1.0;
            targetRotationX = 0;
            targetRotationY = 0;
            currentRotationX = 0;
            currentRotationY = 0;
            camera.position.set(0, 20, 100);
            camera.lookAt(0, 0, 0);
            controls.reset(); // 重置TrackballControls
            showToast('视角已重置');
        }

        // 【修改5】重构toggleBackground函数，改为控制背景信息显示/隐藏
        function toggleBackground() {
            isInfoVisible = !isInfoVisible;
            if (isInfoVisible) {
                glassPanel.style.display = 'block';
                controlTips.style.display = 'block';
                showToast('背景信息已显示');
            } else {
                glassPanel.style.display = 'none';
                controlTips.style.display = 'none';
                showToast('背景信息已隐藏');
            }
        }

        // 新增：社交图标交互函数
        function openGithub() {
            window.open('https://github.com/notcharlatan', '_blank');
        }

        function openX() {
            window.open('https://x.com/goaLatan', '_blank');
        }

        function showEmail() {
            showToast('邮箱：jiang-hu-pian-zi@qq.com');
            // 可选：复制邮箱到剪贴板
            navigator.clipboard.writeText('jiang-hu-pian-zi@qq.com').then(() => {
                setTimeout(() => {
                    showToast('邮箱已复制到剪贴板 ✅');
                }, 1500);
            }).catch(err => {
                console.error('复制失败:', err);
            });
        }

        // 新增：头像互动函数（简易旋转+缩放+提示）
        function avatarInteraction() {
            // 添加旋转动画
            avatarIcon.style.transition = 'all 0.8s ease';
            avatarIcon.style.transform = 'scale(1.2) rotate(360deg)';
            
            // 重置动画
            setTimeout(() => {
                avatarIcon.style.transform = 'scale(1) rotate(0deg)';
            }, 800);
            
            // 显示个性签名提示
            showToast('保持热爱，奔赴山海 ✨');
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: rgba(0,0,0,0.8);
                color: #c5a059;
                padding: 12px 24px;
                border-radius: 4px;
                font-size: clamp(0.7rem, 2vw, 0.8rem);
                z-index: 100;
                pointer-events: none;
                transition: opacity 0.3s ease;
                max-width: 80%;
                text-align: center;
            `;
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = 0;
                setTimeout(() => document.body.removeChild(toast), 300);
            }, 2000);
        }

        // 启动初始化
        initThree();
    </script>
